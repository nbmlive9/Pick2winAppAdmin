<h2>Cost Analytics</h2>
<p class="cost-range" *ngIf="rangeLabel">{{ rangeLabel }}</p>
<div class="provider-card" *ngFor="let cost of costs">
  <div class="provider-head">
    <span class="provider-mark">{{ cost.category.charAt(0) }}</span>
    <span class="provider-name"><strong>{{ cost.category }}</strong><small>Reported cost</small></span>
    <strong class="provider-total">{{ cost.amount }}</strong>
  </div>
</div>
<p class="cost-empty" *ngIf="costs.length === 0">No cost categories were returned.</p>
