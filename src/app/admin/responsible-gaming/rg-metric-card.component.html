<article class="metric-card">
  <div class="metric-label">{{ metric.label }}</div>
  <span class="metric-change" *ngIf="metric.change"
    [class.change-down]="metric.direction === 'down'">
    {{ metric.direction === 'down' ? '↓' : '↑' }} {{ metric.change }}
  </span>
  <div class="metric-value">{{ metric.value }}</div>
  <p>{{ metric.detail }}</p>
  <svg class="metric-sparkline" viewBox="0 0 100 32" preserveAspectRatio="none" aria-hidden="true">
    <polyline [attr.points]="metric.sparkline" [attr.stroke]="metric.color"></polyline>
  </svg>
</article>
